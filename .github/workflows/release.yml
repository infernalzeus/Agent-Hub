name: Build installers

# PyInstaller cannot cross-compile, so each installer is built on its own OS.
# Windows can also be built locally with Build-Release.cmd; this workflow is how
# the macOS and Linux artifacts get made at all.
#
# Triggered by pushing a tag (v0.1.3), or by hand from the Actions tab.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      publish:
        description: "Attach the artifacts to a GitHub Release"
        type: boolean
        default: false

permissions:
  contents: write          # only to create the release; nothing else is needed

jobs:
  build:
    strategy:
      fail-fast: false     # one OS failing should not hide the others' results
      matrix:
        include:
          - os: windows-latest
            name: windows
          - os: macos-latest
            name: macos-arm64
          - os: ubuntu-latest
            name: linux-x86_64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      # The bundled wheels and the Python installer, ~70 MB. Cached on the
      # manifest's hash, so a build only re-downloads them when it changes.
      - name: Cache payloads
        uses: actions/cache@v4
        with:
          path: packaging/payloads
          key: payloads-${{ matrix.name }}-${{ hashFiles('packaging/payloads.json') }}

      - name: Build (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: .\packaging\build-core.ps1 -TestOnly

      - name: Compile installer (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          $pkg = (Get-ChildItem release -Directory | Sort-Object Name | Select-Object -Last 1).FullName + "\AgentHub"
          # Runners ship Inno Setup 6; a dev box may have 7. Find whichever is here.
          $iscc = Get-ChildItem "C:\Program Files (x86)","C:\Program Files","$env:LOCALAPPDATA\Programs" `
                    -Filter ISCC.exe -Recurse -ErrorAction SilentlyContinue |
                  Select-Object -First 1 -ExpandProperty FullName
          if (-not $iscc) { throw "Inno Setup (ISCC.exe) not found on this runner." }
          # AppVersion is required by AgentHub.iss; read it from the manifest.
          $ver = (Get-Content packaging/release-manifest.json -Raw | ConvertFrom-Json).version
          & $iscc /DCandidate "/DSourceDir=$pkg" "/DAppVersion=$ver" packaging\AgentHub.iss

      - name: Build (macOS / Linux)
        if: matrix.os != 'windows-latest'
        run: |
          chmod +x packaging/build-core.sh
          packaging/build-core.sh --candidate

      - uses: actions/upload-artifact@v4
        with:
          name: agent-hub-${{ matrix.name }}
          path: |
            release/**/*.exe
            release/**/*.dmg
            release/**/*.tar.gz
          if-no-files-found: error

  publish:
    # Only for a tag, or an explicit request. A build alone never publishes.
    needs: build
    if: startsWith(github.ref, 'refs/tags/v') || inputs.publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Attach to the release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
          draft: true          # a human decides when it goes public
          generate_release_notes: true
