<svg width="540" viewBox="0 0 540 1885" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Agent Hub drawn as a circuit board. Phone, tablet and laptop reach the Hub on your PC over a private Tailscale network. The Hub has a 3D board and Agent Smith, the voice you talk to. Smith sends each ask through the router, which picks the cheapest thing that can answer, and calls Neo, who designs new agents from a plain description, and the Doctor, who repairs the Hub as a mission you approve. From the router: autonomous LLM missions (missions, dispatch, a private worktree, review, apply), PC control through Windows MCP, the media vault, and the git graph."><rect width="540" height="1885" fill="#05070c"/><defs><marker id="ah" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,1 L7,4 L0,7 z" fill="#00e676" fill-opacity=".6"/></marker></defs><rect x="20.0" y="20" width="238.0" height="68" fill="#0b2037" stroke="#41ebff66"/><text x="30.0" y="44.0" fill="#00e676" fill-opacity="1" font-family="Outfit,Segoe UI,sans-serif" font-size="14" font-weight="700" letter-spacing="0" text-anchor="start">YOUR DEVICES</text><text x="30.0" y="66.0" fill="#a8cbb9" fill-opacity="1" font-family="Outfit,Segoe UI,sans-serif" font-size="12" font-weight="400" letter-spacing="0" text-anchor="start">phone · tablet · laptop</text><rect x="270.0" y="20" width="238.0" height="68" fill="#0b2037" stroke="#41ebff66"/><text x="280.0" y="44.0" fill="#00e676" fill-opacity="1" font-family="Outfit,Segoe UI,sans-serif" font-size="14" font-weight="700" letter-spacing="0" text-anchor="start">PRIVATE NETWORK</text><text x="280.0" y="66.0" fill="#a8cbb9" fill-opacity="1" font-family="Outfit,Segoe UI,sans-serif" font-size="12" font-weight="400" letter-spacing="0" text-anchor="start">Tailscale reaches your PC</text><rect x="20.0" y="100" width="238.0" height="68" fill="#0b2037" stroke="#41ebff66"/><text x="30.0" y="124.0" fill="#00e676" fill-opacity="1" font-family="Outfit,Segoe UI,sans-serif" font-size="14" font-weight="700" letter-spacing="0" text-anchor="start">AGENT SMITH</text><text x="30.0" y="146.0" fill="#a8cbb9" fill-opacity="1" font-family="Outfit,Segoe UI,sans-serif" font-size="12" font-weight="400" letter-spacing="0" text-anchor="start">hears you · routes your ask</text><rect x="270.0" y="100" width="238.0" height="68" fill="#0b2037" stroke="#41ebff66"/><text x="280.0" y="124.0" fill="#00e676" fill-opacity="1" font-family="Outfit,Segoe UI,sans-serif" font-size="14" font-weight="700" letter-spacing="0" text-anchor="start">ROUTER</text><text x="280.0" y="146.0" fill="#a8cbb9" fill-opacity="1" font-family="Outfit,Segoe UI,sans-serif" font-size="12" font-weight="400" letter-spacing="0" text-anchor="start">chooses the right tool</text><rect x="20.0" y="210" width="500.0" height="250" fill="#0b162c" stroke="#00e67666"/><text x="34.0" y="234.0" fill="#41ebff" fill-opacity="1" font-family="Outfit,Segoe UI,sans-serif" font-size="12" font-weight="700" letter-spacing="0" text-anchor="start">FROM ROUTER</text><text x="34.0" y="259.0" fill="#00e676" fill-opacity="1" font-family="Outfit,Segoe UI,sans-serif" font-size="15" font-weight="700" letter-spacing="0" text-anchor="start">AUTONOMOUS LLM</text><text x="38.0" y="286.0" fill="#a8cbb9" fill-opacity="1" font-family="Outfit,Segoe UI,sans-serif" font-size="13" font-weight="400" letter-spacing="0" text-anchor="start">MISSIONS → ask by text or voice</text><text x="38.0" y="320.0" fill="#a8cbb9" fill-opacity="1" font-family="Outfit,Segoe UI,sans-serif" font-size="13" font-weight="400" letter-spacing="0" text-anchor="start">DISPATCH → split into briefs</text><text x="38.0" y="354.0" fill="#a8cbb9" fill-opacity="1" font-family="Outfit,Segoe UI,sans-serif" font-size="13" font-weight="400" letter-spacing="0" text-anchor="start">WORKTREE → a private copy</text><text x="38.0" y="388.0" fill="#a8cbb9" fill-opacity="1" font-family="Outfit,Segoe UI,sans-serif" font-size="13" font-weight="400" letter-spacing="0" text-anchor="start">REVIEW → you read the diff</text><text x="38.0" y="422.0" fill="#a8cbb9" fill-opacity="1" font-family="Outfit,Segoe UI,sans-serif" font-size="13" font-weight="400" letter-spacing="0" text-anchor="start">APPLY → or discard it</text><text x="34.0" y="438.0" fill="#00e676" fill-opacity="1" font-family="Outfit,Segoe UI,sans-serif" font-size="12" font-weight="400" letter-spacing="0" text-anchor="start">YOU approve changes · no automatic merge</text><rect x="20.0" y="480" width="500.0" height="250" fill="#0b162c" stroke="#00e67666"/><text x="34.0" y="504.0" fill="#41ebff" fill-opacity="1" font-family="Outfit,Segoe UI,sans-serif" font-size="12" font-weight="700" letter-spacing="0" text-anchor="start">FROM SMITH</text><text x="34.0" y="529.0" fill="#00e676" fill-opacity="1" font-family="Outfit,Segoe UI,sans-serif" font-size="15" font-weight="700" letter-spacing="0" text-anchor="start">NEO · MAKES AGENTS</text><text x="38.0" y="556.0" fill="#a8cbb9" fill-opacity="1" font-family="Outfit,Segoe UI,sans-serif" font-size="13" font-weight="400" letter-spacing="0" text-anchor="start">DESCRIBE → a job, in plain words</text><text x="38.0" y="590.0" fill="#a8cbb9" fill-opacity="1" font-family="Outfit,Segoe UI,sans-serif" font-size="13" font-weight="400" letter-spacing="0" text-anchor="start">NEO → designs one agent file</text><text x="38.0" y="624.0" fill="#a8cbb9" fill-opacity="1" font-family="Outfit,Segoe UI,sans-serif" font-size="13" font-weight="400" letter-spacing="0" text-anchor="start">REVIEW → you read it, then save</text><text x="38.0" y="658.0" fill="#a8cbb9" fill-opacity="1" font-family="Outfit,Segoe UI,sans-serif" font-size="13" font-weight="400" letter-spacing="0" text-anchor="start">TEAM → orchestrator picks it</text><text x="38.0" y="692.0" fill="#a8cbb9" fill-opacity="1" font-family="Outfit,Segoe UI,sans-serif" font-size="13" font-weight="400" letter-spacing="0" text-anchor="start">SKILLS → abilities you add</text><text x="34.0" y="708.0" fill="#00e676" fill-opacity="1" font-family="Outfit,Segoe UI,sans-serif" font-size="12" font-weight="400" letter-spacing="0" text-anchor="start">YOU approve changes · no automatic merge</text><rect x="20.0" y="750" width="500.0" height="250" fill="#0b162c" stroke="#00e67666"/><text x="34.0" y="774.0" fill="#41ebff" fill-opacity="1" font-family="Outfit,Segoe UI,sans-serif" font-size="12" font-weight="700" letter-spacing="0" text-anchor="start">FROM SMITH</text><text x="34.0" y="799.0" fill="#00e676" fill-opacity="1" font-family="Outfit,Segoe UI,sans-serif" font-size="15" font-weight="700" letter-spacing="0" text-anchor="start">THE DOCTOR · REPAIRS THE HUB</text><text x="38.0" y="826.0" fill="#a8cbb9" fill-opacity="1" font-family="Outfit,Segoe UI,sans-serif" font-size="13" font-weight="400" letter-spacing="0" text-anchor="start">ASK → say it, or ASK THE DOCTOR</text><text x="38.0" y="860.0" fill="#a8cbb9" fill-opacity="1" font-family="Outfit,Segoe UI,sans-serif" font-size="13" font-weight="400" letter-spacing="0" text-anchor="start">FACTS → the Hub&#x27;s own status</text><text x="38.0" y="894.0" fill="#a8cbb9" fill-opacity="1" font-family="Outfit,Segoe UI,sans-serif" font-size="13" font-weight="400" letter-spacing="0" text-anchor="start">MISSION → a fix in a private copy</text><text x="38.0" y="928.0" fill="#a8cbb9" fill-opacity="1" font-family="Outfit,Segoe UI,sans-serif" font-size="13" font-weight="400" letter-spacing="0" text-anchor="start">CHECKS → compile and tests</text><text x="38.0" y="962.0" fill="#a8cbb9" fill-opacity="1" font-family="Outfit,Segoe UI,sans-serif" font-size="13" font-weight="400" letter-spacing="0" text-anchor="start">APPLY → you press it</text><text x="34.0" y="978.0" fill="#00e676" fill-opacity="1" font-family="Outfit,Segoe UI,sans-serif" font-size="12" font-weight="400" letter-spacing="0" text-anchor="start">YOU approve changes · no automatic merge</text><rect x="20.0" y="1020" width="500.0" height="250" fill="#0b162c" stroke="#00e67666"/><text x="34.0" y="1044.0" fill="#41ebff" fill-opacity="1" font-family="Outfit,Segoe UI,sans-serif" font-size="12" font-weight="700" letter-spacing="0" text-anchor="start">FROM ROUTER</text><text x="34.0" y="1069.0" fill="#00e676" fill-opacity="1" font-family="Outfit,Segoe UI,sans-serif" font-size="15" font-weight="700" letter-spacing="0" text-anchor="start">PC CONTROL</text><text x="38.0" y="1096.0" fill="#a8cbb9" fill-opacity="1" font-family="Outfit,Segoe UI,sans-serif" font-size="13" font-weight="400" letter-spacing="0" text-anchor="start">SAY IT → plain words</text><text x="38.0" y="1130.0" fill="#a8cbb9" fill-opacity="1" font-family="Outfit,Segoe UI,sans-serif" font-size="13" font-weight="400" letter-spacing="0" text-anchor="start">LOOK → finds controls by name</text><text x="38.0" y="1164.0" fill="#a8cbb9" fill-opacity="1" font-family="Outfit,Segoe UI,sans-serif" font-size="13" font-weight="400" letter-spacing="0" text-anchor="start">ASK FIRST → shows the press</text><text x="38.0" y="1198.0" fill="#a8cbb9" fill-opacity="1" font-family="Outfit,Segoe UI,sans-serif" font-size="13" font-weight="400" letter-spacing="0" text-anchor="start">ACT → click, type, open</text><text x="38.0" y="1232.0" fill="#a8cbb9" fill-opacity="1" font-family="Outfit,Segoe UI,sans-serif" font-size="13" font-weight="400" letter-spacing="0" text-anchor="start">CHECK → the window changed</text><text x="34.0" y="1248.0" fill="#00e676" fill-opacity="1" font-family="Outfit,Segoe UI,sans-serif" font-size="12" font-weight="400" letter-spacing="0" text-anchor="start">YOU approve changes · no automatic merge</text><rect x="20.0" y="1290" width="500.0" height="250" fill="#0b162c" stroke="#00e67666"/><text x="34.0" y="1314.0" fill="#41ebff" fill-opacity="1" font-family="Outfit,Segoe UI,sans-serif" font-size="12" font-weight="700" letter-spacing="0" text-anchor="start">FROM ROUTER</text><text x="34.0" y="1339.0" fill="#00e676" fill-opacity="1" font-family="Outfit,Segoe UI,sans-serif" font-size="15" font-weight="700" letter-spacing="0" text-anchor="start">MEDIA VAULT</text><text x="38.0" y="1366.0" fill="#a8cbb9" fill-opacity="1" font-family="Outfit,Segoe UI,sans-serif" font-size="13" font-weight="400" letter-spacing="0" text-anchor="start">DOWNLOAD → yt-dlp</text><text x="38.0" y="1400.0" fill="#a8cbb9" fill-opacity="1" font-family="Outfit,Segoe UI,sans-serif" font-size="13" font-weight="400" letter-spacing="0" text-anchor="start">CONVERT → ffmpeg</text><text x="38.0" y="1434.0" fill="#a8cbb9" fill-opacity="1" font-family="Outfit,Segoe UI,sans-serif" font-size="13" font-weight="400" letter-spacing="0" text-anchor="start">SAVE → to your folder</text><text x="38.0" y="1468.0" fill="#a8cbb9" fill-opacity="1" font-family="Outfit,Segoe UI,sans-serif" font-size="13" font-weight="400" letter-spacing="0" text-anchor="start">BROWSE → your drives</text><text x="38.0" y="1502.0" fill="#a8cbb9" fill-opacity="1" font-family="Outfit,Segoe UI,sans-serif" font-size="13" font-weight="400" letter-spacing="0" text-anchor="start">RECEIVE → from your phone</text><text x="34.0" y="1518.0" fill="#00e676" fill-opacity="1" font-family="Outfit,Segoe UI,sans-serif" font-size="12" font-weight="400" letter-spacing="0" text-anchor="start">YOU approve changes · no automatic merge</text><rect x="20.0" y="1560" width="500.0" height="250" fill="#0b162c" stroke="#00e67666"/><text x="34.0" y="1584.0" fill="#41ebff" fill-opacity="1" font-family="Outfit,Segoe UI,sans-serif" font-size="12" font-weight="700" letter-spacing="0" text-anchor="start">FROM ROUTER</text><text x="34.0" y="1609.0" fill="#00e676" fill-opacity="1" font-family="Outfit,Segoe UI,sans-serif" font-size="15" font-weight="700" letter-spacing="0" text-anchor="start">GIT GRAPH</text><text x="38.0" y="1636.0" fill="#a8cbb9" fill-opacity="1" font-family="Outfit,Segoe UI,sans-serif" font-size="13" font-weight="400" letter-spacing="0" text-anchor="start">PROJECT MAP → status at a glance</text><text x="38.0" y="1670.0" fill="#a8cbb9" fill-opacity="1" font-family="Outfit,Segoe UI,sans-serif" font-size="13" font-weight="400" letter-spacing="0" text-anchor="start">DIFF → line by line</text><text x="34.0" y="1788.0" fill="#00e676" fill-opacity="1" font-family="Outfit,Segoe UI,sans-serif" font-size="12" font-weight="400" letter-spacing="0" text-anchor="start">YOU approve changes · no automatic merge</text><text x="20.0" y="1865.0" fill="#a8cbb9" fill-opacity="1" font-family="Outfit,Segoe UI,sans-serif" font-size="11" font-weight="400" letter-spacing="0" text-anchor="start">→ Request / handoff · Smith calls Neo and the Doctor · Desktop control: Windows only</text></svg>