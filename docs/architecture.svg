<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 720" role="img" aria-label="Your devices connect through a private network to Agent Hub and its PC tools"><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10" fill="#41ebff"/></marker></defs><style>text{font-family:Outfit,system-ui,sans-serif}.wire{fill:none;stroke:#41ebff;stroke-width:2;stroke-opacity:.65;marker-end:url(#ah)}.fl{stroke-dasharray:7 5}.module{fill:#07162c;fill-opacity:.42;stroke:#41ebff;stroke-opacity:.5}</style><rect class="module" x="33.0" y="272.0" width="294" height="130"/><text x="180" y="333" fill="#00e676" font-size="24" text-anchor="middle">YOUR DEVICES</text><text x="180" y="361" fill="#d9ffe9" font-size="16" text-anchor="middle">Phone · tablet · laptop</text><path class="wire fl" d="M328 337L380 337"/><rect class="module" x="382.0" y="281.0" width="206" height="112"/><text x="485" y="333" fill="#00e676" font-size="20" text-anchor="middle">PRIVATE NETWORK</text><text x="485" y="361" fill="#d9ffe9" font-size="16" text-anchor="middle">Tailscale</text><path class="wire fl" d="M590 337L665 337"/><image href="assets/agent-hub-mark.png" x="675" y="245" width="180" height="180"/><text x="765" y="463" fill="#00e676" font-size="30" text-anchor="middle">AGENT HUB</text><text x="765" y="494" fill="#d9ffe9" font-size="21" text-anchor="middle">Runs on your PC</text><rect class="module" x="585.0" y="50.0" width="360" height="94"/><text x="765" y="93" fill="#00e676" font-size="22" text-anchor="middle">CHOOSE YOUR INPUT</text><text x="765" y="121" fill="#d9ffe9" font-size="16" text-anchor="middle">Mouse · touch · voice · hands</text><path class="wire fl" d="M765 145L765 234"/><path class="wire fl" d="M865 337L944 337L944 90L1000 90"/><rect class="module" x="1003.0" y="37.0" width="394" height="106"/><text x="1200" y="86" fill="#00e676" font-size="23" text-anchor="middle">MEDIA + FILES</text><text x="1200" y="114" fill="#d9ffe9" font-size="16" text-anchor="middle">Download · convert · inbox</text><path class="wire fl" d="M865 337L944 337L944 249L1000 249"/><rect class="module" x="1003.0" y="196.0" width="394" height="106"/><text x="1200" y="245" fill="#00e676" font-size="23" text-anchor="middle">DESKTOP CONTROL</text><text x="1200" y="273" fill="#d9ffe9" font-size="16" text-anchor="middle">Windows MCP · approval first</text><path class="wire fl" d="M865 337L944 337L944 408L1000 408"/><rect class="module" x="1003.0" y="355.0" width="394" height="106"/><text x="1200" y="404" fill="#00e676" font-size="23" text-anchor="middle">PROJECTS + GIT</text><text x="1200" y="432" fill="#d9ffe9" font-size="16" text-anchor="middle">Project map · branches · diffs</text><path class="wire fl" d="M865 337L944 337L944 567L1000 567"/><rect class="module" x="1003.0" y="514.0" width="394" height="106"/><text x="1200" y="563" fill="#00e676" font-size="23" text-anchor="middle">MISSIONS</text><text x="1200" y="591" fill="#d9ffe9" font-size="16" text-anchor="middle">Private worktree · your review</text><path class="wire fl" d="M765 505L765 568"/><rect class="module" x="553.0" y="574.0" width="424" height="102"/><text x="765" y="621" fill="#00e676" font-size="23" text-anchor="middle">EXTEND YOUR HUB</text><text x="765" y="649" fill="#d9ffe9" font-size="16" text-anchor="middle">Own web apps · helpers · skills</text><text x="215" y="578" fill="#41ebff" font-size="22" text-anchor="middle">ONE FRONT DOOR</text><text x="215" y="613" fill="#d9ffe9" font-size="21" text-anchor="middle">The PC runs the work.</text><text x="215" y="644" fill="#d9ffe9" font-size="18" text-anchor="middle">Other devices stay within reach.</text></svg>