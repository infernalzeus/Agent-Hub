<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Agent Hub · Shared app renderer</title><style>body{margin:0;background:#070a25;color:#d9ffe9;font:14px system-ui;padding:24px}h1{color:#00e676;font-size:24px}button,select{background:#0d1050;border:1px solid #00e67666;border-radius:8px;color:#d9ffe9;padding:10px;margin:4px;font:inherit}#panel{border:1px solid #00e67655;border-radius:18px;min-height:480px;padding:24px;overflow:auto}#mark{position:relative;width:320px;height:320px;margin:auto;touch-action:none}p{color:#a8cbb9;line-height:1.6}</style><h1>AGENT HUB · SHARED APP RENDERER</h1><p>This uses the same bundle as the Hub dormant page and website. Hover steers the globe; drag turns the core. Click/tap the core for the facet-wave swap. Click/tap the surrounding panel to switch the globe.</p><button id="shell">Globe on / off</button><button id="state">Live / dormant</button><button id="pulse">Pulse</button><label>Size <select id="size"><option selected>320</option><option>480</option><option>960</option></select></label><div id="panel"><div id="mark"></div></div><p id="status"></p><script src="../docs/assets/agent-hub-mark.min.js?v=20261014i"></script><script>
const host=document.getElementById('mark');let live=true,mark,off;function build(){if(off)off();if(mark)mark.destroy();host.style.width=host.style.height=document.getElementById('size').value+'px';mark=AgentHubMark.mount(host,{mode:'crystal',state:live?'live':'dormant',touchLock:true});off=AgentHubMark.tapToToggle(document.getElementById('panel'),mark,host);window.appDemoMark=mark;document.getElementById('status').textContent=matchMedia('(pointer:coarse)').matches?'Phone path: GPU facet wave, spin preserved.':'Desktop path: full facet wave. Hover steers the globe.';}
document.getElementById('shell').onclick=()=>mark.setShell(!mark.isShell());document.getElementById('state').onclick=()=>{live=!live;mark.setState(live?'live':'dormant');};document.getElementById('pulse').onclick=()=>mark.pulse();document.getElementById('size').onchange=build;build();window.addEventListener('pagehide',()=>{if(off)off();if(mark)mark.destroy();});
</script></html>
